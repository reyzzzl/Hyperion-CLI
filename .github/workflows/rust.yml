name: Rust

on:
  push:
    branches: [ "rust" ]
  pull_request:
    branches: [ "rust" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Add Linux target
        if: runner.os == 'Linux'
        run: rustup target add x86_64-unknown-linux-gnu
      - name: Build Linux
        if: runner.os == 'Linux'
        run: RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target x86_64-unknown-linux-gnu
      - name: Build macOS
        if: runner.os == 'macOS'
        run: cargo build --release
      - name: Build Windows
        if: runner.os == 'Windows'
        run: cargo build --release
      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-linux
          path: target/x86_64-unknown-linux-gnu/release/hyperion
      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-macos
          path: target/release/hyperion
      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-windows
          path: target/release/hyperion.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/hyperion-linux/hyperion
            dist/hyperion-macos/hyperion
            dist/hyperion-windows/hyperion.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
