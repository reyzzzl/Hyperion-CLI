[package]
name = "hyperion"
version = "1.0.0"
edition = "2024"
authors = ["Hyperion Team"]
license = "GPL-3.0"
description = "Quantum-resistant encrypted messenger"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
anyhow = "1.0"
hex = "0.4"
rand = "0.8"
blake2 = "0.10"
sha2 = "0.10"
chacha20poly1305 = { version = "0.10", features = ["std"] }
aead = "0.5"
oqs = "0.9.0"
zeroize = { version = "1.7", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
argon2 = "0.5"
hkdf = "0.12"
socks = "0.3"
serde_bytes = "0.11"

[profile.release]
lto = true
strip = true
codegen-units = 1
