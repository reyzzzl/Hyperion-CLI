[workspace]
members = ["hyperion_core", "hyperion_core/pyo3"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
authors = ["Hyperion Team"]
repository = "https://github.com/hyperion/hyperion"

[workspace.dependencies]
oqs = "0.9.0"
zeroize = "1.7"
blake2 = "0.10"
sha2 = "0.10"
hmac = "0.12"
xchacha20poly1305 = "0.10"
rand_core = "0.6"
rand = "0.8"
subtle = "2.5"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
pyo3 = { version = "0.20", features = ["extension-module"] }