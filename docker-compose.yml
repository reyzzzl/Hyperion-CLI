version: '3.8'

services:
  alice:
    build: .
    container_name: hyperion-alice
    ports:
      - "9999:9999"
    volumes:
      - ./data/alice:/root/.hyperion
    stdin_open: true
    tty: true
    command: host
    networks:
      - hyperion_net

  bob:
    build: .
    container_name: hyperion-bob
    volumes:
      - ./data/bob:/root/.hyperion
    stdin_open: true
    tty: true
    command: connect alice:9999
    depends_on:
      - alice
    networks:
      - hyperion_net

networks:
  hyperion_net:
    driver: bridge